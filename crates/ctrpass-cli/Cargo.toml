[package]
name = "ctrpass-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ctrpass"
path = "src/main.rs"

[dependencies]
ctrpass = { path = "../ctrpass" }
ctrlc = "3"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
png = "0.18"
serde_json = "1"
