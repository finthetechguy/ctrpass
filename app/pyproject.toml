[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrpass-app"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PyGObject>=3.48", "ctrpass"]

[project.scripts]
ctrpass-app = "ctrpass_app.main:main"

[tool.setuptools]
packages = ["ctrpass_app"]

[tool.setuptools.package-data]
ctrpass_app = ["icons/*.svg"]
