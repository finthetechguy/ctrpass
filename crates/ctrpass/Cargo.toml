[package]
name = "ctrpass"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes = "0.8"
ccm = "0.5"
getrandom = "0.3"
hmac = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "auto-dispatch"] }

[dev-dependencies]
tempfile = "3"
wat = "1"
